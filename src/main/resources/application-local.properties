
# ===============================
# LOCAL DEVELOPMENT
# ===============================

spring.application.name=lostoria

# Local PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lostoria_local}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# Local development JWT secret only
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-this-before-use-123456789}

# Redis running locally
spring.data.redis.url=redis://localhost:6379
spring.data.redis.timeout=500ms

# Cache
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=lostoria:
spring.cache.redis.use-key-prefix=true

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Debug logging
logging.level.com.example.lostoria=DEBUG
logging.level.org.springframework.data.redis=INFO
